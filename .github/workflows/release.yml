# Tests and builds the .deb in Debian trixie arm64, the CardputerZero OS.
#
# - Push to main: when the version in app-builder.json has no v<version> tag yet,
#   creates the GitHub release v<version> with the .deb and publishes it to the
#   CardputerZero store. Bump it with scripts/bump-version.sh; pushes that keep
#   the version only run the tests and the build.
# - Pull request or manual run: tests and builds a dev .deb, kept as a workflow
#   artifact without publishing.
# - Manual run with "Publish to the store": builds the release .deb of the current
#   version and publishes only to the store, e.g. when the store step failed.
#
# Secrets: CZDEV_TOKEN (optional) — classic GitHub PAT with the public_repo and
# workflow scopes, of the account that owns the app in the store. czdev forks
# CardputerZero/packages with it, uploads the .deb to the fork and opens the
# publish PR. Without it the store step is skipped.

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      store:
        description: Publish the current version to the CardputerZero store
        type: boolean
        default: false

permissions:
  contents: write

# Releases run one at a time: a queued run sees the tag the previous one created
# and skips. A new push to a pull request cancels its previous run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
      store: ${{ steps.plan.outputs.store }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags decide whether this version is already released

      - id: plan
        env:
          STORE_INPUT: ${{ inputs.store }}
        run: |
          version="$(jq -r .version app-builder.json)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::Version in app-builder.json must look like 1.2.3, got '$version'"; exit 1; }
          publish=false
          store=false
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$STORE_INPUT" == true ]]; then
            store=true
          elif [[ "$GITHUB_EVENT_NAME" == push ]]; then
            if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
              echo "::notice::v$version is already released. Run scripts/bump-version.sh to publish a new release."
            else
              publish=true
              store=true
            fi
          fi
          {
            echo "version=$version"
            echo "publish=$publish"
            echo "store=$store"
          } >> "$GITHUB_OUTPUT"
          echo "version=$version publish=$publish store=$store"

      - name: Test and build the .deb
        env:
          RELEASE: ${{ steps.plan.outputs.store == 'true' && '1' || '' }}
        run: ./build-deb.sh

      - uses: actions/upload-artifact@v7
        with:
          name: pocketalert-cardputer-${{ steps.plan.outputs.version }}
          path: dist/*.deb
          if-no-files-found: error

  # The store's own install path policy and maintainer script check, so a rejected
  # package fails before the release is created. The policy script comes from the
  # store's main branch to track its current rules, so it runs without a token.
  store-check:
    needs: build
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: pocketalert-cardputer-${{ needs.build.outputs.version }}
          path: dist

      - name: Store package checks
        run: |
          deb="$(ls dist/*.deb)"
          curl -fsSL https://raw.githubusercontent.com/CardputerZero/packages/main/.github/scripts/install_path_policy.py \
            -o "$RUNNER_TEMP/install_path_policy.py"
          python3 "$RUNNER_TEMP/install_path_policy.py" pocketalert-cardputer "$deb" "$RUNNER_TEMP/bad-paths"
          if [[ -s "$RUNNER_TEMP/bad-paths" ]]; then
            echo "::error::The store rejects these install paths:"; cat "$RUNNER_TEMP/bad-paths"; exit 1
          fi
          dpkg-deb -e "$deb" "$RUNNER_TEMP/ctrl"
          for scr in preinst postinst prerm postrm; do
            [[ -f "$RUNNER_TEMP/ctrl/$scr" ]] || continue
            # Same pattern as validate-pr.yml in CardputerZero/packages.
            if grep -nE 'rm[[:space:]]+(-[a-zA-Z]+[[:space:]]+)*(/([[:space:]]|$)|/(bin|etc|usr|var|home|boot|lib))|(curl|wget)[^|]*\|[[:space:]]*(ba)?sh|mkfs|/etc/(passwd|shadow|sudoers)|dd[[:space:]][^|]*of=/dev/' "$RUNNER_TEMP/ctrl/$scr"; then
              echo "::error::The store rejects a pattern in the $scr maintainer script"; exit 1
            fi
          done

  release:
    needs: [build, store-check]
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: pocketalert-cardputer-${{ needs.build.outputs.version }}
          path: dist

      # The tag is created on this commit together with the release, so a failed
      # build leaves no tag behind and the next push retries.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          sha256sum *.deb > checksums.txt
          gh release create "v$VERSION" *.deb checksums.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "v$VERSION" --generate-notes

  store:
    needs: [build, store-check, release]
    # Also after a skipped release: a manual store-only run has no release job.
    if: >-
      !cancelled() && needs.build.result == 'success' && needs.store-check.result == 'success'
      && needs.build.outputs.store == 'true'
      && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Check token
        id: token
        env:
          CZDEV_TOKEN: ${{ secrets.CZDEV_TOKEN }}
        run: |
          if [[ -z "$CZDEV_TOKEN" ]]; then
            echo "::warning::CZDEV_TOKEN is not set, the store was not updated. Publish by hand: czdev publish --deb <file>"
            echo "set=false" >> "$GITHUB_OUTPUT"
          else
            echo "set=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.token.outputs.set == 'true'

      # The store gets the same file as the GitHub release; this run's build is
      # only used when the version has no release yet.
      - name: Download the released .deb
        id: released
        if: steps.token.outputs.set == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir dist; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v7
        if: steps.token.outputs.set == 'true' && steps.released.outputs.found != 'true'
        with:
          name: pocketalert-cardputer-${{ needs.build.outputs.version }}
          path: dist

      # Opens a PR to CardputerZero/packages. Updates merge automatically once its
      # checks pass; the first release waits for a maintainer and a device video.
      - name: Publish to the CardputerZero store
        if: steps.token.outputs.set == 'true'
        env:
          CZDEV_TOKEN: ${{ secrets.CZDEV_TOKEN }}
        run: |
          git clone --depth 1 https://github.com/CardputerZero/AppBuilder.git "$RUNNER_TEMP/AppBuilder"
          mkdir -p ~/.czdev
          umask 077
          jq -n --arg t "$CZDEV_TOKEN" '{github_token: $t}' > ~/.czdev/credentials
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # czdev pushes to the fork over SSH; the runner has no key, so use the token over HTTPS.
          git config --global url."https://x-access-token:${CZDEV_TOKEN}@github.com/".insteadOf "git@github.com:"
          "$RUNNER_TEMP/AppBuilder/czdev" publish --deb dist/*.deb
